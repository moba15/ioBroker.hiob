<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>

    <style>
        .m {
            padding: 20px;
        }
        .table-values th, .table-values td {
            text-align: left;
            padding: 10px;
        }
        .header-title {
            margin-bottom: 20px;
        }
        
        /* Dark Mode Styles */
        body.dark {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark .table-values th, 
        body.dark .table-values td,
        body.dark h4,
        body.dark p,
        body.dark span {
            color: #e0e0e0 !important;
        }
        body.dark .table-values.highlight>tbody>tr:hover {
            background-color: #2c2c2c !important;
        }
        body.dark .btn {
            background-color: #333 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
    <div class="m adapter-container">
        <div class="row">
            <div class="col s12 header-title">
                <h4>App Devices Management</h4>
                <p>Here you can manage the devices that connect to the ioBroker backend. Check the box to approve a device.</p>
            </div>
        </div>
        
        <div class="row">
            <div class="col s12">
                <table class="table-values highlight">
                    <thead>
                        <tr>
                            <th>Device Name</th>
                            <th>Device ID</th>
                            <th>Approved</th>
                           
                        </tr>
                    </thead>
                    <tbody id="devices-table-body">
                        <tr><td colspan="4">Loading devices...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="row">
            <div class="col s12">
                <button id="btn-refresh" class="btn waves-effect waves-light blue">Refresh List
                    <i class="material-icons right">refresh</i>
                </button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript">
        // Extract instance from URL parameters
        var adapterInstance = window.location.search.slice(1).split('&').find(p => p.startsWith('instance='));
        if (adapterInstance) {
            adapterInstance = adapterInstance.split('=')[1];
        } else {
            adapterInstance = '0';
        }
        var adapterNamespace = 'hiob-dev.' + adapterInstance;

        // Apply dark mode if requested via URL
        if (window.location.search.indexOf('react=dark') !== -1 || window.location.search.indexOf('theme=dark') !== -1) {
            $('body').addClass('dark');
        }

        // Try to get the existing socket connection from the parent window, or create a new one
        var socket;
        try {
            socket = window.parent && window.parent.socket ? window.parent.socket : (window.socket || io.connect());
        } catch (e) {
            socket = io.connect();
        }
        
        function sendToBackend(command, data, callback) {
            if (socket && typeof socket.emit === 'function') {
                socket.emit('sendTo', adapterNamespace, command, data, callback);
            } else {
                console.error("Socket not available");
                alert("Could not connect to ioBroker Admin Socket.");
            }
        }

        function loadDevices() {
            sendToBackend('getDevices', {}, function (result) {
                var $tbody = $('#devices-table-body');
                $tbody.empty();

                if (!result || !result.devices || result.devices.length === 0) {
                    $tbody.append('<tr><td colspan="4">No devices found. Ensure the app has requested to connect.</td></tr>');
                    return;
                }
                
                // Bind change events
                $('.device-approve-cb').on('change', function() {
                    var deviceId = $(this).data('device-id');
                    var isApproved = $(this).prop('checked');
                    
                    sendToBackend('setDeviceApproval', { deviceId: deviceId, approved: isApproved }, function(res) {
                        if (res && res.error) {
                            alert('Error updating device: ' + res.error);
                        } else {
                            M.toast({html: 'Device ' + (isApproved ? 'approved' : 'rejected'), classes: 'rounded green'});
                        }
                    });
                });

                $('.device-pwd-cb').on('change', function() {
                    var deviceId = $(this).data('device-id');
                    var needPwd = $(this).prop('checked');
                    
                    sendToBackend('setDevicePasswordRequired', { deviceId: deviceId, needPwd: needPwd }, function(res) {
                        if (res && res.error) {
                            alert('Error updating password requirement: ' + res.error);
                        } else {
                            M.toast({html: 'Password ' + (needPwd ? 'required' : 'not required'), classes: 'rounded green'});
                        }
                    });
                });
            });
        }

        // Initialize when ready
        $(document).ready(function() {
            setTimeout(function() {
                loadDevices();
            }, 500); // Small delay to let socket establish
            
            $('#btn-refresh').on('click', loadDevices);
        });
    </script>
</body>
</html>
